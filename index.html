<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 英语智能语音通话伴学伙伴</title>
  <!-- iPad / iOS 原生全屏与 PWA 支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Voice">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-dark">
  <div class="voice-app-container">
    
    <!-- 顶部状态栏与模块化选择 -->
    <header class="top-bar">
      <div class="brand">
        <span class="pulse-dot"></span>
        <span class="brand-title">AI Voice Tutor</span>
      </div>

      <div class="top-controls">
        <!-- 课件随时切换下拉菜单 -->
        <div class="dropdown-wrapper">
          <label for="coursewareSelect">📚 课件/场景：</label>
          <select id="coursewareSelect" title="切换课件"></select>
        </div>

        <!-- 设置按钮（切换模型与语音参数） -->
        <button id="openSettingsBtn" class="icon-btn" title="模型与语音设置">⚙️ 设置</button>
      </div>
    </header>

    <!-- 核心主体：ChatGPT 风格灵动声波球 -->
    <main class="voice-main">
      <div class="voice-orb-container" id="orbContainer">
        <!-- 多层辉光声波球 -->
        <div class="orb-halo"></div>
        <div class="orb-core" id="orbCore">
          <div class="orb-wave wave1"></div>
          <div class="orb-wave wave2"></div>
          <div class="orb-wave wave3"></div>
          <span class="orb-icon" id="orbIcon">🎙️</span>
        </div>
      </div>

      <!-- 实时状态提示语 -->
      <div class="status-indicator" id="statusIndicator">点击下方按钮开始语音通话</div>
      <div class="sub-status" id="subStatus">双手免提 · 像真人打微信电话一样聊英语</div>

      <!-- 实时字幕对讲卡片 -->
      <div class="transcript-card" id="transcriptCard">
        <div class="transcript-box" id="transcriptBox">
          <div class="transcript-line system">🌟 戴上耳机或开大音量，点击绿色通话按钮开始吧！</div>
        </div>
      </div>
    </main>

    <!-- 底部通话控制器 -->
    <footer class="bottom-action-bar">
      <div class="action-buttons-group">
        <!-- 挂断/开始通话主按键 -->
        <button id="callToggleBtn" class="call-btn start-call" title="开始/挂断通话">
          <span class="btn-icon">📞</span>
          <span class="btn-text">开始通话</span>
        </button>

        <!-- 麦克风静音控制 -->
        <button id="muteBtn" class="control-btn" title="麦克风静音" disabled>
          <span class="btn-icon">🎤</span>
          <span class="btn-text">正常听音</span>
        </button>

        <!-- 打字辅助输入抽屉开关 -->
        <button id="textInputToggleBtn" class="control-btn" title="不想说话时文字辅助">
          <span class="btn-icon">⌨️</span>
          <span class="btn-text">键盘文字</span>
        </button>
      </div>

      <!-- 隐藏式的文字辅助输入区 -->
      <div class="text-drawer" id="textDrawer">
        <input type="text" id="manualTextInput" placeholder="遇到生词或不想说话时，可以这里打字发送...">
        <button id="manualSendBtn">发送</button>
      </div>
    </footer>
  </div>

  <!-- ⚙️ 模块化设置模态窗口（随时换模型、换语音、换参数） -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙️ 系统与模块化设置</h3>
        <button id="closeSettingsBtn" class="close-x">&times;</button>
      </div>

      <div class="modal-body">
        <!-- 1. 模型提供商（随心切换） -->
        <div class="config-section">
          <h4>🤖 语言大模型大脑 (LLM Provider)</h4>
          <div class="form-group">
            <label>快速预设服务商：</label>
            <select id="modelPresetSelect">
              <option value="deepseek">DeepSeek (官方直连)</option>
              <option value="qwen">阿里通义千问 (DashScope)</option>
              <option value="siliconflow">SiliconFlow (硅基流动)</option>
              <option value="openai">OpenAI (GPT-4o / GPT-4o-mini)</option>
              <option value="ollama">本地 Ollama (完全离线本地模型)</option>
              <option value="custom">自定义 OpenAI 兼容接口</option>
            </select>
          </div>

          <div class="form-group">
            <label>API 基础端点 (Base URL)：</label>
            <input type="text" id="cfgBaseUrl" placeholder="https://api.deepseek.com/v1">
          </div>

          <div class="form-group">
            <label>API Key (密钥，仅保存在您本地浏览器)：</label>
            <input type="password" id="cfgApiKey" placeholder="sk-xxxxxxxxxxxxxxxx">
            <small class="tip">没有 Key？可免费在 DeepSeek 或 阿里云百炼 领取使用</small>
          </div>

          <div class="form-group">
            <label>模型名称 (Model ID)：</label>
            <input type="text" id="cfgModelName" placeholder="deepseek-chat">
          </div>
        </div>

        <!-- 2. 语音合成与声音控制 -->
        <div class="config-section">
          <h4>🗣️ 语音与听感控制 (Voice & Audio)</h4>
          <div class="form-group">
            <label>英语朗读音色：</label>
            <select id="cfgVoiceSelect"></select>
            <button id="testVoiceBtn" class="small-btn">试听发音 🔊</button>
          </div>

          <div class="form-group">
            <label>语速调节：<span id="rateValLabel">0.85x (推荐小学生)</span></label>
            <input type="range" id="cfgSpeechRate" min="0.6" max="1.3" step="0.05" value="0.85">
          </div>

          <div class="form-group">
            <label>静音断句灵敏度 (孩子停顿多久后 AI 接话)：<span id="vadValLabel">1.2 秒</span></label>
            <input type="range" id="cfgVadTimeout" min="0.8" max="2.5" step="0.1" value="1.2">
          </div>
        </div>

        <!-- 3. 课件与教学策略 -->
        <div class="config-section">
          <h4>🎓 教学模式与发音体验</h4>
          <div class="form-group">
            <label>伴学语言模式：</label>
            <select id="cfgTeachModeSelect">
              <option value="bilingual">中英双语亲切启发模式（推荐小学生，讲英文带中文释义与提示）</option>
              <option value="english">纯英文沉浸交流模式（进阶挑战）</option>
            </select>
          </div>
          <div class="form-group">
            <label>麦克风识别语言：</label>
            <select id="cfgRecogLangSelect">
              <option value="zh-CN">中英双语自适应识别（孩子说中文或英文均可听懂）</option>
              <option value="en-US">纯英语识别（严格英文发音模式）</option>
            </select>
          </div>
          <div class="form-group checkbox-group">
            <label>
              <input type="checkbox" id="cfgRecastEnabled" checked>
              <span>开启“隐性无痛重铸”（不直接批评，用正确句子接话培养语感）</span>
            </label>
          </div>
          <div class="form-group checkbox-group">
            <label>
              <input type="checkbox" id="cfgShowZhSubtitle" checked>
              <span>在字幕卡片中显示中文辅助翻译</span>
            </label>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="saveSettingsBtn" class="primary-btn">保存并应用</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
